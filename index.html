.hd b{font-size:18px}.card{background:var(--c);border-radius:12px;padding:12px;margin:8px 0}.card.done{border-left:4px solid var(--g)}

.set{display:flex;gap:6px;align-items:center;margin:4px 0}.set span{width:42px;color:var(--m);font-size:13px}.set input{width:0;flex:1;text-align:center}
textarea{width:100%;margin-top6px;margin-top:6px;resize:vertical}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0c0e11;border-top:1px solid #2a323d;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;background:none;padding:14px 0;color:var(--m)}nav button.on{color:var(--a);font-weight:700}
.sm{padding:4px 10px}.mut{color:var(--m);font-size:13px}label{display:block;margin:10px 0 3px;color:var(--m);font-size:13px}label+input,label+select{width:100%}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 3px;border-bottom:1px solid #2a323d;text-align:left;vertical-align:top}
.kpi{display:flex;gap:8px}.kpi div{flex:1;background:var(--c);border-radius:10px;padding:8px;text-align:center}.kpi b{display:block;font-size:18px;color:var(--a)}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#000c;padding:8px 14px;border-radius:20px;display:none}
</style></head><body><main id="app"></main><div id="toast"></div>

 s.ex.forEach(e=>{const q=PLAN[pd(d)].items[e.k]||{};const ok=e.s.map((x,j)=>[j+1,x[0],x[1]]).filter(x=>x[2]!=='');
  const base=[d,s.wk,s.day,q.sec||'Extra',e.p,e.n];
  if(ok.length)ok.forEach((x,i)=>r.push([...base,x[0],x[1],x[2],i===0?e.m:'']));else if(e.m)r.push([...base,'','','',e.m])});
 if(s.cd.done||s.cd.m)r.push([d,s.wk,s.day,'Cardio',PLAN[pd(d)].cardio,PLAN[pd(d)].cardio,'','','',(s.cd.done?'DONE. ':'')+s.cd.m])});return r}
const HEAD=['Date','Week','Day','Section','Planned exercise','Exercise done','Set','Weight (kg)','Reps/Secs','Remarks'];
const body=()=>Object.entries(S.body).map(([w,b])=>[+w,b.wt||'',b.waist||'',b.chest||'',b.arms||'',b.en||'',b.sl||'',b.mood||'']);
async function sync(){if(!S.cfg.url){toast('Add Web App URL in Settings');return}
 const dates=Object.keys(S.ses).filter(d=>S.ses[d].dirty);if(!dates.length&&!Object.keys(S.body).length){toast('Nothing new');return}
 const r=rows(true);try{await fetch(S.cfg.url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({dates,rows:r,body:body()})});
  dates.forEach(d=>S.ses[d].dirty=0);save();toast('Synced ✔ to Google Sheet');if(tab!=='b')R()}catch(e){toast('Offline — will sync later')}}
async function xl(){if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=no;document.head.append(s)}).catch(()=>toast('Need internet for export'));
 if(!window.XLSX)return;const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HEAD,...rows(false)]),'Log');
 XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Week','Weight','Waist','Chest','Arms','Energy','Sleep','Mood'],...body()]),'Body');
 const out=XLSX.write(wb,{type:'array',bookType:'xlsx'}),f=new File([out],'Phase4_Workout_Log.xlsx',{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 if(navigator.canShare&&navigator.canShare({files:[f]}))try{await navigator.share({files:[f],title:'Phase 4 log'});return}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
const touch=()=>{const s=ses();s.dirty=1;save();clearTimeout(timer);if(S.cfg.url)timer=setTimeout(sync,5000)};
document.addEventListener('input',e=>{const t=e.target,d=t.dataset,s=ses();
 if(d.f!==undefined){const x=s.ex[d.k];if(d.f==='m')x.m=t.value;else x.s[d.j][d.f]=t.value;touch();if(d.f==='1')t.closest('.card').classList.toggle('done',x.s.some(y=>y[1]!==''))}
 else if(d.c){s.cd[d.c]=d.c==='done'?t.checked:t.value;touch()}
 else if(d.b){const w=s.wk;(S.body[w]=S.body[w]||{})[d.b]=t.value;save();if(S.cfg.url){clearTimeout(timer);timer=setTimeout(sync,5000)}}
 else if(t.id==='dt'&&t.value){date=t.value;R()}else if(t.id==='ps'){pex=t.value;R()}
 else if(t.id==='wt'){const old=ses(),x=+t.value,has=old.ex.some(e=>e.s.some(y=>y[1]!=='')||e.m)||old.ex.length>PLAN[pd(date)].items.length;
  if(has&&!confirm('Switch workout type? This clears the exercises already entered for this date.')){R();return}
  const wk=old.wk,cd=old.cd;delete S.ses[date];const n=ses(x);n.wk=wk;n.cd=cd;n.dirty=1;save();R()}
 else if(t.id==='url'){S.cfg.url=t.value.trim();save()}else if(t.id==='st'){S.cfg.start=t.value;save()}});
document.addEventListener('click',e=>{const n=e.target.closest('nav button');if(n){tab=n.dataset.t;R();return}
 const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,s=ses(),k=b.dataset.k;
 const shift=n=>{const d=new Date(date+'T12:00');d.setDate(d.getDate()+n);date=iso(d);R()};
 if(a==='prev')shift(-1);else if(a==='next')shift(1);else if(a==='wm'){s.wk=Math.max(1,s.wk-1);touch();R()}else if(a==='wp'){s.wk++;touch();R()}
 else if(a==='ads'){s.ex[k].s.push(['','']);touch();R()}else if(a==='rms'){if(s.ex[k].s.length>1)s.ex[k].s.pop();touch();R()}
 else if(a==='ren'){const x=s.ex[k],v=prompt('Exercise name for today (planned: '+x.p+')',x.n);if(v&&v.trim()){x.n=v.trim();touch();R()}}
 else if(a==='add'){const v=prompt('New exercise name for today');if(v&&v.trim()){s.ex.push({k:'x'+s.ex.length,p:v.trim(),n:v.trim(),m:'',s:[['',''],['',''],['','']]});touch();R()}}
 else if(a==='del'){if(confirm('Remove this exercise?')){s.ex.splice(k,1);touch();R()}}
 else if(a==='sync')sync();else if(a==='xl')xl()});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
addEventListener('online',()=>unsynced()&&S.cfg.url&&sync());R();
</script></body></html>
